name: Release

# Two ways in and one path out. Pushing a version tag publishes a release carrying the MSI; running
# the workflow by hand bumps the version first, commits it, pushes the tag, and then does exactly
# the same thing (design D1).
#
# The dispatch run does not stop at the tag and wait to be started again by it. A push made with
# GITHUB_TOKEN deliberately raises no workflow event on GitHub's side, so a bump job that only
# tagged would leave a tag and no release. It feeds the run it was dispatched into instead, which is
# what `version`'s `always()` and every downstream job's `ref` are for.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'An exact version instead, without the leading v (e.g. 0.2.0-rc.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Bump the version
    # Only the hand-started half. A tag push arrives with the bump already made, by this job on an
    # earlier run or by a person.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, so an existing one is refused here rather than by the push at the end of this
          # job — after the version has already been committed to the branch.
          fetch-depth: 0

      - name: Write the new version
        id: bump
        # Through the inputs' environment rather than through ${{ }}, so a version string is data to
        # this script and never a fragment of it.
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          VERSION="$(./packaging/bump-version.sh "${EXACT:-$BUMP}")"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists; nothing was committed."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props
          git commit -m "Bump the version to $VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          # The branch first: a tag pointing at a commit that is not on the branch it was cut from
          # is the failure worth avoiding, and it is the push more likely to be refused of the two.
          git push origin "HEAD:$BRANCH"
          git push origin "v$VERSION"

  version:
    name: Version
    # `always()`, because a tag push skips `bump` and a skipped dependency would otherwise skip
    # this job and the whole release with it.
    needs: bump
    if: always() && (github.event_name == 'push' || needs.bump.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      # One version, and every artifact of the release derives from this (design D4). A tag carrying
      # a pre-release part (v0.1.0-rc.1) publishes as a pre-release, which is what the release
      # workflow is rehearsed with.
      #
      # The tag is named here rather than read from github.ref_name downstream, because on a
      # dispatch run that is the branch the workflow was started from, not the tag this release is.
      - id: derive
        env:
          BUMPED: ${{ needs.bump.outputs.version }}
        run: |
          VERSION="${BUMPED:-${GITHUB_REF#refs/tags/v}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $VERSION"

  build:
    name: Build
    needs: version
    # Explicit, like `version`'s: a skipped job skips everything downstream of it, not only the jobs
    # that name it, so on a tag push the skipped `bump` would skip this job and the release too.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, which on a dispatch run is a commit made minutes ago by the bump job and is not
          # what this run was started against.
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # main takes direct pushes, so a tag can point at a commit CI never ran. The release runs the
      # tests itself, and a failing test stops it before anything is published (design D1).
      - name: Test
        run: dotnet test Pisum.Transcribe.slnx -c Release

      - name: Build the MSI
        run: ./packaging/windows/build-msi.ps1 -Version $env:VERSION
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    # Only after the build: if it fails, this job never runs and nothing is published. The condition
    # is explicit for the same reason as `build`'s.
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The MSI contains libuiohook (LGPL) and the WiX custom actions (MS-RL), whose licenses ask
      # for their source to come with the binaries. So their source, at the commits
      # THIRD-PARTY-NOTICES.md names, goes onto the same release as the MSI. A failed download
      # fails the job before anything is published.
      - name: Download the source of libuiohook and WiX
        env:
          LIBUIOHOOK_COMMIT: a41658fb2bef7503a3bcb305ab8bf849755fe906
          WIX_COMMIT: b3f340393117094a75ea8ced77f2357e4aa095e7
        run: |
          curl -fsSL -o "artifacts/libuiohook-$LIBUIOHOOK_COMMIT.tar.gz" \
            "https://github.com/TolikPylypchuk/libuiohook/archive/$LIBUIOHOOK_COMMIT.tar.gz"
          curl -fsSL -o "artifacts/wix-$WIX_COMMIT.tar.gz" \
            "https://github.com/wixtoolset/wix/archive/$WIX_COMMIT.tar.gz"

      - name: List what will be published
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pisum Transcribe v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Pisum.Transcribe_${{ needs.version.outputs.version }}_win-x64.msi
            artifacts/libuiohook-*.tar.gz
            artifacts/wix-*.tar.gz
