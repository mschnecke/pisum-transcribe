name: Package dry run

# TEMPORARY, for task 3.1 of add-macos-packaging: release.yml's build-macos steps with the real certificate on this
# branch, publishing nothing. Delete this file before the pull request is merged.
on:
  push:
    branches:
      - feature/22-add-macos-packaging

permissions:
  contents: read

jobs:
  build-macos:
    name: Build the macOS package (dry run)
    runs-on: macos-latest
    env:
      VERSION: 1.4.0-dry.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/pisum-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERTIFICATE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046 # one argument per keychain already in the list
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build the package
        run: ./packaging/macos/build-pkg.sh "$VERSION"

      - name: Delete the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pisum-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-dry-run
          path: artifacts/*.pkg
          if-no-files-found: error
          retention-days: 3
