name: CI

# Pull requests and pushes to main alike: main is unprotected and takes direct pushes, so a commit
# can reach it without ever having been a pull request (design D1).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest

    env:
      # Never released; it exists so the packaging script gets the one argument it takes.
      VERSION: 0.1.0-ci.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pisum.Transcribe.slnx

      - name: Build
        run: dotnet build Pisum.Transcribe.slnx --no-restore

      # No filter, the same command as locally (design D7). The hardware tests are
      # [Fact(Explicit = true)] and don't run without --explicit on, and a test that can't run on
      # this runner skips itself with its reason in the output.
      - name: Test
        run: dotnet test Pisum.Transcribe.slnx

      # Every change builds and validates the MSI, so the packaging doesn't rot between releases
      # (design D3).
      - name: Build the MSI
        run: ./packaging/windows/build-msi.ps1 -Version $env:VERSION
        shell: pwsh

      - name: Upload the MSI
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: 7

  # The same commands on Apple silicon. The build also compiles the Swift helper and assembles the dev app bundle,
  # signed ad hoc, so both are checked on every change; nothing is uploaded (design D13 of add-macos-shell).
  macos:
    name: macos-latest
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pisum.Transcribe.slnx

      - name: Build
        run: dotnet build Pisum.Transcribe.slnx --no-restore

      - name: Test
        run: dotnet test Pisum.Transcribe.slnx
